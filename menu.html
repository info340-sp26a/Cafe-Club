<body>
    <nav>
        <ul>     
            <li><a href="index.html">
                <span class="material-icons" aria-label="Home">home</span>
            </a></li>
            <li><a href="staff.html">Staff View</a></li>
        </ul>         
    </nav>
    <header>
        <h1 class="app-title"> Cafe Club </h1>
    </header>
    <div class="banner">
        <h1> [Insert menu title] </h1>
        <button>save</button> <!--will be a form-->
        <button id="sendStaff">send to staff</button> <!--will be a modal--> 

    <div class="customize">

        <button type="button" class="collapsible" aria-expanded="true" aria-controls="customizeContent" aria-label="Expand Menu"><span class="material-icons" aria-label="Customize">palette</span></button> <!--will be a collapsible menu-->
        
        <h2>Customize Menu Appearance</h2>

        <form action="menu.html" method="GET">
            <!-- labeling text for the input -->
            <label for="chooseColor">Choose a menu color:</label>

            <select name="animal">
                <option value=""></option>
                <option value="pink">Pink</option>
                <option value="green">Green</option>
                <option value="yellow">Yellow</option>
                <option value="blue">Blue</option>
            </select>

            <!-- Submit button -->
            <button type="submit">Update</button>
        </form>

    </div>
    

    <div class="menu">

    </div>
    
</body>
